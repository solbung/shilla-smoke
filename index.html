<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신라의 향연 - 안석(고흥당)</title>
    <!-- 구글 서라벌체 (Noto Serif KR) 불러오기 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Serif KR', serif;
            margin: 0;
            padding: 20px 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 배경 사진 설정 (사진 파일명을 bg.jpg 로 하시면 됩니다) */
            background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background-color: rgba(20, 20, 20, 0.75);
            padding: 40px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            text-align: center;
            backdrop-filter: blur(5px);
        }
        .title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: #f3e5ab; /* 고전적인 연황금색 */
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .author {
            font-size: 1.05rem;
            color: #cccccc;
            margin-bottom: 35px;
            font-weight: 300;
        }
        .content {
            font-size: 1.1rem;
            line-height: 2.2;
            word-break: keep-all;
            white-space: pre-line;
            color: #eaeaea;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
        }
        .audio-control {
            margin-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 25px;
        }
        .audio-btn {
            background: linear-gradient(135deg, #8b7355, #5c4a38);
            color: #ffffff;
            border: 1px solid #a68b68;
            padding: 12px 28px;
            font-size: 1rem;
            font-family: 'Noto Serif KR', serif;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .audio-btn:active {
            transform: scale(0.98);
        }
        /* 클로바더빙/타입캐스트에서 받은 MP3 파일용 플레이어 */
        audio {
            width: 100%;
            margin-top: 15px;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title">신라의 향연</div>
        <div class="author">안석 (고흥당)</div>
        
        <div class="content" id="poem-text">
천년의 세월 넘어
서라벌 달빛 아래 향로를 사르고

짙은 향연 속으로
잊혀진 역사의 숨결이 차오른다.

바람결에 실려온 고요한 종소리
가슴속 깊은 울림으로 남아서

오늘 밤도 은은히
신라의 꿈을 품어 안는다.
        </div>

        <div class="audio-control">
            <!-- MP3 오디오 파일이 있는 경우 (audio.mp3 올리셨을 때) -->
            <audio controls>
                <source src="audio.mp3" type="audio/mp3">
                브라우저가 오디오 재생을 지원하지 않습니다.
            </audio>
        </div>
    </div>

</body>
</html>
