<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신라의 향연 - 안석(고흥당)</title>
    <!-- 구글 서라벌체 (Noto Serif KR) 불러오기 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Noto Serif KR', serif;
            margin: 0;
            padding: 20px 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* 배경 사진 설정 (bg.jpg 파일 사용) */
            background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('bg.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: #ffffff;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background-color: rgba(20, 20, 20, 0.75);
            padding: 40px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
            text-align: center;
            backdrop-filter: blur(5px);
        }
        .title {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: #f3e5ab; /* 연황금색 */
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        .author {
            font-size: 1.05rem;
            color: #cccccc;
            margin-bottom: 35px;
            font-weight: 300;
        }
        .content {
            font-size: 1.1rem;
            line-height: 2.2;
            word-break: keep-all;
            white-space: pre-line;
            color: #eaeaea;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
        }
        .audio-control {
            margin-top: 25px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 25px;
        }
        .audio-btn {
            background: linear-gradient(135deg, #8b7355, #5c4a38);
            color: #ffffff;
            border: 1px solid #a68b68;
            padding: 12px 28px;
            font-size: 1rem;
            font-family: 'Noto Serif KR', serif;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .audio-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title">신라의 향연</div>
        <div class="author">안석 (고흥당)</div>
        
        <div class="content" id="poem-text">천년의 세월 넘어
서라벌 달빛 아래 향로를 사르고

짙은 향연 속으로
잊혀진 역사의 숨결이 차오른다.

바람결에 실려온 고요한 종소리
가슴속 깊은 울림으로 남아서

오늘 밤도 은은히
신라의 꿈을 품어 안는다.</div>

        <div class="audio-control">
            <button class="audio-btn" onclick="toggleSpeech()">
                <span id="btn-icon">▶</span> <span id="btn-text">시 낭송 듣기</span>
            </button>
        </div>
    </div>

    <script>
        let isSpeaking = false;
        let speech = new SpeechSynthesisUtterance();
        
        speech.lang = 'ko-KR';
        speech.rate = 0.8;  // 은은한 낭송을 위해 천천히 설정
        speech.pitch = 0.9; // 조금 낮고 정갈한 톤 설정

        function toggleSpeech() {
            const poemText = document.getElementById('poem-text').innerText;
            const btnIcon = document.getElementById('btn-icon');
            const btnText = document.getElementById('btn-text');

            if (!isSpeaking) {
                speech.text = poemText;
                window.speechSynthesis.speak(speech);
                isSpeaking = true;
                btnIcon.innerText = "⏹";
                btnText.innerText = "낭송 멈추기";

                speech.onend = function() {
                    isSpeaking = false;
                    btnIcon.innerText = "▶";
                    btnText.innerText = "시 낭송 듣기";
                };
            } else {
                window.speechSynthesis.cancel();
                isSpeaking = false;
                btnIcon.innerText = "▶";
                btnText.innerText = "시 낭송 듣기";
            }
        }
    </script>

</body>
</html>
