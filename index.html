<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신라의 향연 - 안석</title>
    <!-- 구글 서라벌체 (Noto Serif KR) 불러오기 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            font-family: 'Noto Serif KR', serif !important;
            color: #ffffff;
            background-color: #000000;
        }

        /* 모바일/PC 고정 배경 이미지 */
        .bg-img {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 1;
        }

        /* 은은함을 위해 어둡게 누르는 오버레이도 살짝 옅게 조정 */
        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.35); /* 기존 0.65에서 0.35로 밝혀서 배경 강조 */
            z-index: 2;
        }

        .wrapper {
            position: relative;
            z-index: 3;
            width: 100%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
        }

        /* ★ 시 쪽지 박스 투명도 조절 ★ */
        .container {
            width: 100%;
            max-width: 520px;
            /* 불투명도를 낮춰 뒤의 배경(첨성대/별빛)이 투과되도록 설정 */
            background-color: rgba(10, 10, 10, 0.50); 
            padding: 45px 30px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            text-align: center;
            /* 유리 느낌을 주는 블러 효과 */
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            margin: auto;
        }

        .title {
            font-size: 1.85rem;
            font-weight: 700;
            letter-spacing: 2px;
            margin-bottom: 8px;
            color: #f3e5ab; /* 황금빛 */
            text-shadow: 0 2px 5px rgba(0, 0, 0, 0.9);
        }
        .author {
            font-size: 1.05rem;
            color: #e0e0e0;
            margin-bottom: 40px;
            font-weight: 300;
            letter-spacing: 1px;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
        }
        .content {
            font-size: 1.08rem;
            line-height: 2.3;
            word-break: keep-all;
            white-space: pre-line;
            color: #ffffff;
            margin-bottom: 40px;
            letter-spacing: 0.5px;
            text-align: center;
            /* 가독성을 높이기 위해 글자 뒤에 선명한 그림자 추가 */
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.95), 0 0 10px rgba(0,0,0,0.8);
        }
        .audio-control {
            margin-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            padding-top: 30px;
        }
        .audio-btn {
            background: linear-gradient(135deg, rgba(139, 115, 85, 0.85), rgba(92, 74, 56, 0.85));
            color: #ffffff;
            border: 1px solid #a68b68;
            padding: 13px 32px;
            font-size: 1.02rem;
            font-family: 'Noto Serif KR', serif !important;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.6);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(4px);
        }
        .audio-btn:active {
            transform: scale(0.97);
        }
    </style>
</head>
<body>

    <img src="chsd.JPG" alt="배경사진" class="bg-img">
    <div class="bg-overlay"></div>

    <div class="wrapper">
        <div class="container">
            <div class="title">신라의 향연(香煙)</div>
            <div class="author">- 고흥당 -</div>
            
            <div class="content" id="poem-text">서라벌 어둠이 짙어지면
돌은 두려움을 깎아
단아한 자태로 고여들고,

하늘 뜻을 물어 신라를 품고픈
여왕은,
생명이 솟아나는 우물이 되어
땅 위에 수주(水柱)를 세웠다.

창(窓)의 턱을 넘지 않는
채움과 비움이 만나는
차원의 경계선에,

염원이 그 문턱을 넘어 재가 되면
단단한 기하(幾何)는
하늘로 일어선 향로가 되고.

마침내 발원에서 피어오른 염원은
우물 밖의 아득한 길을 트나니,

하늘에 닿아 별빛 사이로 스며들 때,
신라 천년의 흔들림마저
자욱한 아름다움으로 가라앉아라.</div>

            <div class="audio-control">
                <button class="audio-btn" onclick="toggleSpeech()">
                    <span id="btn-icon">▶</span> <span id="btn-text">시 낭송 듣기</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        let isSpeaking = false;
        let synth = window.speechSynthesis;
        let speech = new SpeechSynthesisUtterance();
        
        speech.lang = 'ko-KR';
        speech.rate = 0.78;
        speech.pitch = 0.88;

        function toggleSpeech() {
            const btnIcon = document.getElementById('btn-icon');
            const btnText = document.getElementById('btn-text');

            if (!isSpeaking) {
                synth.cancel(); 
                
                let poemText = document.getElementById('poem-text').innerText;
                poemText = poemText.replace(/\([^)]*\)/g, '');
                
                speech.text = "신라의 향연. 고흥당. " + poemText;
                synth.speak(speech);
                
                isSpeaking = true;
                btnIcon.innerText = "⏹";
                btnText.innerText = "낭송 멈추기";

                speech.onend = function() {
                    isSpeaking = false;
                    btnIcon.innerText = "▶";
                    btnText.innerText = "시 낭송 듣기";
                };
            } else {
                synth.cancel();
                isSpeaking = false;
                btnIcon.innerText = "▶";
                btnText.innerText = "시 낭송 듣기";
            }
        }
    </script>

</body>
</html>
